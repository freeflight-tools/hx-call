<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HX Call: tel: probe</title>
<link rel="stylesheet" href="../hx/base.css">
<style>
/* ── Diagnostic tool, not part of the app ──────────────────────────────
   Load it as an XCTrack Web page widget and work down the list. Several
   of these tests navigate the widget away from this page, so every result
   is written to localStorage *before* the attempt is made and read back
   on the next load. Reload the widget after each test.

   Delete this file once the tel: question is settled.                   */

body{background:var(--ink);padding:8px 8px 30px;font-size:calc(13px * var(--scale))}
h1{margin:0 0 2px;font-size:1.15em}
h2{margin:16px 0 6px;font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
p{margin:0 0 8px;color:var(--dim);font-size:.82em;line-height:1.45}

.env{
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  padding:7px 8px;font-family:var(--mono);font-size:.7em;line-height:1.5;
  color:var(--fg);word-break:break-all;
}
.env b{color:var(--dim);font-weight:400}

.t{
  display:block;width:100%;margin:0 0 6px;padding:11px 10px;text-align:left;
  background:var(--panel-hi);border:1px solid var(--rule);border-radius:3px;
  color:var(--fg);font:600 .9em var(--sans);text-decoration:none;
}
.t small{display:block;margin-top:2px;font-family:var(--mono);font-weight:400;
  font-size:.76em;color:var(--dim);word-break:break-all}

#ask{
  background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:3px;
  padding:9px;margin:0 0 12px;
}
#ask p{color:var(--amber);margin:0 0 8px;font-weight:600;font-size:.85em}
#ask button{
  display:block;width:100%;margin:0 0 5px;padding:10px;
  background:var(--panel);border:1px solid var(--amber-line);border-radius:3px;
  color:var(--fg);font:600 .85em var(--sans);
}
#log{
  margin:0;padding:8px;background:var(--panel);border:1px solid var(--rule);
  border-radius:3px;font-family:var(--mono);font-size:.68em;line-height:1.55;
  color:var(--fg);white-space:pre-wrap;word-break:break-all;
}
.row{display:flex;gap:6px;margin-top:8px}
.row button{
  flex:1;padding:10px;background:var(--panel-hi);border:1px solid var(--rule);
  border-radius:3px;color:var(--fg);font:600 .82em var(--sans);
}
</style>
</head>
<body>

<h1>tel: probe</h1>
<p>Tap one test, see what the phone does, reload the widget, then answer the
question that appears. The number is deliberately invalid, so nothing can be
dialled by accident.</p>

<div class="env" id="env"></div>

<div id="ask" hidden></div>

<h2>Tests</h2>
<div id="tests"></div>

<h2>Report</h2>
<pre id="log"></pre>
<div class="row">
  <button type="button" id="copy">Copy report</button>
  <button type="button" id="clear">Clear</button>
</div>

<script>
"use strict";

/* An invalid number: +41 followed by zeros is not routable, so even a host
   that fires ACTION_CALL instead of ACTION_DIAL cannot connect anything. */
const NUM = "+41000000000";
const KEY = "hxTelProbe";

const TESTS = [
  {id:"anchor-tel",   kind:"a",   href:"tel:" + NUM,
   label:"1. tel: as a link",     note:'<a href="tel:…">, what the widget uses today'},
  {id:"assign-tel",   kind:"btn", label:"2. tel: by assignment",
   note:"location.href = 'tel:…'", go:function(){ location.href = "tel:" + NUM; }},
  {id:"intent-dial",  kind:"btn", label:"3. intent:// to the dialer",
   note:"intent://…#Intent;scheme=tel;action=android.intent.action.DIAL;end",
   go:function(){
     location.href = "intent://" + NUM +
       "#Intent;scheme=tel;action=android.intent.action.DIAL;end";
   }},
  {id:"open-tel",     kind:"btn", label:"4. tel: in a new window",
   note:"window.open('tel:…','_blank'), needs multiple windows in the host",
   go:function(){ window.open("tel:" + NUM, "_blank"); }},
  {id:"blank-https",  kind:"a",   href:"../index.html", target:"_blank",
   label:"5. https link, new window",
   note:'target="_blank": does an ordinary link escape to the browser?'},
  {id:"plain-https",  kind:"a",   href:"../index.html",
   label:"6. https link, same window",
   note:"the control: this should simply load inside the widget"},
  {id:"clipboard",    kind:"btn", label:"7. copy to clipboard",
   note:"the fallback if nothing above dials, no navigation",
   go:function(done){
     const write = function(ok, how){ done(ok ? "copied via " + how : "both methods failed"); };
     if (navigator.clipboard && navigator.clipboard.writeText){
       navigator.clipboard.writeText(NUM).then(function(){ write(true, "navigator.clipboard"); },
                                              function(){ legacy(); });
     } else legacy();
     function legacy(){
       try {
         const ta = document.createElement("textarea");
         ta.value = NUM; ta.style.position = "fixed"; ta.style.opacity = "0";
         document.body.appendChild(ta); ta.focus(); ta.select();
         const ok = document.execCommand("copy");
         document.body.removeChild(ta);
         write(ok, "execCommand");
       } catch(e){ write(false); }
     }
   }}
];

const OUTCOMES = ["Dialer opened", "Error page", "Browser opened",
                  "Nothing happened", "Something else"];

/* ── log, kept across the navigations these tests cause ────────────── */

function read(){
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; }
}
function write(l){
  try { localStorage.setItem(KEY, JSON.stringify(l)); } catch(e){}
}
function stamp(){
  const d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) +
         ":" + ("0" + d.getSeconds()).slice(-2);
}

function begin(id){                       // written *before* we navigate away
  const l = read();
  l.push({id:id, at:stamp(), outcome:null});
  write(l);
}
function finish(outcome){
  const l = read();
  for (let i = l.length - 1; i >= 0; i--)
    if (!l[i].outcome){ l[i].outcome = outcome; break; }
  write(l);
  render();
}

/* ── environment ──────────────────────────────────────────────────── */

const env = [
  ["XCTrack interface", typeof XCTrack !== "undefined" ? "present" : "absent"],
  ["Location", (function(){
      try { return typeof XCTrack !== "undefined" ? String(XCTrack.getLocation()).slice(0, 60) : "n/a"; }
      catch(e){ return "threw: " + e.message; }
    })()],
  ["Android WebView", / wv\)/.test(navigator.userAgent) ? "yes (UA says wv)" : "not per UA"],
  ["clipboard API", navigator.clipboard && navigator.clipboard.writeText ? "present" : "absent"],
  ["service worker", navigator.serviceWorker
      ? (navigator.serviceWorker.controller ? "controlling" : "supported, not controlling")
      : "absent"],
  ["User agent", navigator.userAgent]
];
document.getElementById("env").innerHTML = env.map(function(e){
  return "<b>" + e[0] + ":</b> " + String(e[1]).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}).join("<br>");

/* ── tests ────────────────────────────────────────────────────────── */

const tests = document.getElementById("tests");
for (const t of TESTS){
  let el;
  if (t.kind === "a"){
    el = document.createElement("a");
    el.href = t.href;
    if (t.target) el.target = t.target;
    el.addEventListener("click", function(){ begin(t.id); });
  } else {
    el = document.createElement("button");
    el.type = "button";
    el.addEventListener("click", function(){
      begin(t.id);
      t.go(function(result){          // non-navigating tests report inline
        finish(result);
      });
    });
  }
  el.className = "t";
  el.innerHTML = "";
  el.appendChild(document.createTextNode(t.label));
  const s = document.createElement("small");
  s.textContent = t.note;                 // notes contain literal markup
  el.appendChild(s);
  tests.appendChild(el);
}

/* ── the question after a test that navigated away ────────────────── */

function render(){
  const l = read();

  const ask = document.getElementById("ask");
  const open = l.length && !l[l.length - 1].outcome ? l[l.length - 1] : null;
  ask.innerHTML = "";
  ask.hidden = !open;
  if (open){
    const p = document.createElement("p");
    p.textContent = "You ran “" + open.id + "”. What did the phone do?";
    ask.appendChild(p);
    for (const o of OUTCOMES){
      const b = document.createElement("button");
      b.type = "button"; b.textContent = o;
      b.addEventListener("click", function(){ finish(o); });
      ask.appendChild(b);
    }
  }

  document.getElementById("log").textContent = l.length
    ? l.map(function(e){
        return e.at + "  " + e.id + "  →  " + (e.outcome || "awaiting answer");
      }).join("\n")
    : "nothing recorded yet";
}

document.getElementById("clear").addEventListener("click", function(){
  write([]); render();
});

document.getElementById("copy").addEventListener("click", function(){
  const text = "HX Call tel: probe\n" +
    env.map(function(e){ return e[0] + ": " + e[1]; }).join("\n") +
    "\n\n" + document.getElementById("log").textContent;
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  this.textContent = "Copied";
  const btn = this;
  setTimeout(function(){ btn.textContent = "Copy report"; }, 1500);
});

render();
</script>
</body>
</html>
